# Weekly dependency updates, grouped into one PR per app (T11-03, NFR-S.3).
# Takes effect once the repository is on GitHub (T0-02).
version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: saturday
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: saturday
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
